[project]
name = "rag-research-agent"
version = "0.1.0"
description = "RAG and research agent over company knowledge sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.9.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the network or large downloads; run with: uv run pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: slow tests that use real services or models (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
